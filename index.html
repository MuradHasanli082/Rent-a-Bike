
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>BikeTrack Online</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, setDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDchCKogW7II_cAW0VUhc01elixEr56vEU",
      authDomain: "rent-a-bike-354bd.firebaseapp.com",
      projectId: "rent-a-bike-354bd",
      storageBucket: "rent-a-bike-354bd.firebasestorage.app",
      messagingSenderId: "1097573956413",
      appId: "1:1097573956413:web:391e9e2531623bbb1c2354",
      measurementId: "G-LEC08GQ2T2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const bikeTableBody = document.querySelector("#bikeTable tbody");
    const inventoryTableBody = document.querySelector("#inventoryTable tbody");
    const bikeSelect = document.getElementById("bikeSelect");

    let inventory = [];
    let data = [];

    async function loadInventory() {
      const snapshot = await getDocs(collection(db, "inventory"));
      inventory = snapshot.docs.map(doc => doc.data());
      renderInventory();
    }

    async function loadData() {
      const snapshot = await getDocs(collection(db, "rentals"));
      data = snapshot.docs.map(doc => doc.data());
      renderTable();
    }

    async function addInventory() {
      const type = document.getElementById("inventoryType").value;
      const count = parseInt(document.getElementById("inventoryCount").value);
      if (!type || isNaN(count)) return alert("Eksik bilgi");

      await setDoc(doc(db, "inventory", type), { type, total: count });

      document.getElementById("inventoryType").value = "";
      document.getElementById("inventoryCount").value = "";
      loadInventory();
    }

    function renderInventory() {
      inventoryTableBody.innerHTML = "";
      bikeSelect.innerHTML = "<option value=''>Bisiklet Seç</option>";
      inventory.forEach(item => {
        const available = item.total - data.filter(d => d.bike === item.type).length;
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${item.type}</td>
          <td>${item.total}</td>
          <td>${available}</td>
          <td><button onclick="deleteInventory('${item.type}')">Sil</button></td>
        `;
        inventoryTableBody.appendChild(row);
        if (available > 0) {
          bikeSelect.innerHTML += `<option value="${item.type}">${item.type} (${available})</option>`;
        }
      });
    }

    async function deleteInventory(type) {
      await deleteDoc(doc(db, "inventory", type));
      loadInventory();
    }

    async function addOrUpdateEntry() {
      const bike = document.getElementById("bikeSelect").value;
      const courier = document.getElementById("courier").value;
      const vin = document.getElementById("vin").value;
      const startDate = document.getElementById("startDate").value;
      const price = document.getElementById("price").value;
      if (!bike || !courier || !vin || !startDate || !price) return alert("Eksik bilgi");

      const start = new Date(startDate);
      const today = new Date();
      const daysPassed = Math.floor((today - start) / (1000 * 60 * 60 * 24));
      const weeksPassed = Math.floor(daysPassed / 7);
      const nextPayment = new Date(start);
      nextPayment.setDate(start.getDate() + (weeksPassed + 1) * 7);

      const entry = {
        bike, courier, vin, startDate,
        price: price + " zł",
        nextPayment: nextPayment.toISOString().split("T")[0],
        note: ""
      };

      await addDoc(collection(db, "rentals"), entry);
      loadData();
    }

    function renderTable() {
      bikeTableBody.innerHTML = "";
      const today = new Date();
      data.forEach(entry => {
        const start = new Date(entry.startDate);
        const daysPassed = Math.floor((today - start) / (1000 * 60 * 60 * 24));
        const weeksPassed = Math.floor(daysPassed / 7);
        const nextPayment = new Date(start);
        nextPayment.setDate(start.getDate() + (weeksPassed + 1) * 7);
        entry.nextPayment = nextPayment.toISOString().split("T")[0];

        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${entry.bike}</td>
          <td>${entry.courier}</td>
          <td>${entry.vin}</td>
          <td>${entry.startDate}</td>
          <td>${entry.price}</td>
          <td>${entry.nextPayment}</td>
          <td>${entry.note}</td>
          <td></td>
        `;
        bikeTableBody.appendChild(row);
      });
    }

    loadInventory();
    loadData();
  </script>
</head>
<body>
  <h2>BikeTrack Online (Firebase)</h2>

  <h3>Envanter</h3>
  <table id="inventoryTable">
    <thead>
      <tr>
        <th>Bisiklet Türü</th>
        <th>Toplam</th>
        <th>Boşta</th>
        <th>İşlem</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <input type="text" id="inventoryType" placeholder="Tür">
  <input type="number" id="inventoryCount" placeholder="Adet">
  <button onclick="addInventory()">Kaydet</button>

  <h3>Kiralama</h3>
  <table id="bikeTable">
    <thead>
      <tr>
        <th>Bisiklet</th>
        <th>Kurye</th>
        <th>VIN</th>
        <th>Başlama</th>
        <th>Ücret</th>
        <th>Ödeme</th>
        <th>Not</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <select id="bikeSelect"></select>
  <input type="text" id="courier" placeholder="Kurye Adı">
  <input type="text" id="vin" placeholder="VIN">
  <input type="date" id="startDate">
  <input type="number" id="price" placeholder="Haftalık Ücret">
  <button onclick="addOrUpdateEntry()">Kaydet</button>
</body>
</html>
